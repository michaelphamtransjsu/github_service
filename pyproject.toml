[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-issues-gateway"
version = "0.1.0"
description = "Contract-first FastAPI gateway for GitHub issues"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "openapi-spec-validator>=0.7,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.24,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]
