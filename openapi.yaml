openapi: 3.1.0
info:
  title: GitHub Issues Gateway
  version: 0.1.0
  description: Issue and comment management and signed GitHub webhook intake.
servers:
- url: http://localhost:8000
  description: Local development
tags:
- name: system
- name: issues
- name: comments
- name: webhooks
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Check service health
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /issues:
    get:
      tags:
      - issues
      summary: List repository issues
      operationId: listIssues
      parameters:
      - $ref: '#/components/parameters/State'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Link:
              $ref: '#/components/headers/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      security:
      - BearerAuth: []
    post:
      tags:
      - issues
      summary: Create an issue
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
      responses:
        '201':
          description: Issue created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      security:
      - BearerAuth: []
  /issues/{issue_number}:
    parameters:
    - $ref: '#/components/parameters/IssueNumber'
    get:
      tags:
      - issues
      summary: Get an issue
      operationId: getIssue
      responses:
        '200':
          description: Issue details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      security:
      - BearerAuth: []
    patch:
      tags:
      - issues
      summary: Update an issue
      operationId: updateIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Updated issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      security:
      - BearerAuth: []
  /issues/{issue_number}/comments:
    parameters:
    - $ref: '#/components/parameters/IssueNumber'
    get:
      tags:
      - comments
      summary: List issue comments
      operationId: listIssueComments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Link:
              $ref: '#/components/headers/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      security:
      - BearerAuth: []
    post:
      tags:
      - comments
      summary: Add an issue comment
      operationId: createIssueComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      security:
      - BearerAuth: []
  /webhook:
    post:
      tags:
      - webhooks
      summary: Receive a signed GitHub webhook
      operationId: receiveGitHubWebhook
      parameters:
      - name: X-GitHub-Event
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-GitHub-Delivery
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha256=[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Delivery recorded (or previously recorded).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /events:
    get:
      tags:
      - webhooks
      summary: List received webhook deliveries
      operationId: listWebhookEvents
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Stored deliveries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventMetadata'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  headers:
    RequestId:
      description: Correlation identifier supplied by the client or generated by the service.
      schema:
        type: string
    Location:
      description: Relative URL of the created issue.
      schema:
        type: string
    Link:
      description: GitHub pagination links, when available.
      schema:
        type: string
    RetryAfter:
      description: When the client may retry.
      schema:
        type: string
    RateLimitLimit:
      description: GitHub rate-limit ceiling.
      schema:
        type: string
    RateLimitRemaining:
      description: Remaining GitHub requests.
      schema:
        type: string
    RateLimitReset:
      description: GitHub reset epoch.
      schema:
        type: string
    RateLimitResource:
      description: GitHub rate-limit resource.
      schema:
        type: string
  parameters:
    IssueNumber:
      name: issue_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    State:
      name: state
      in: query
      schema:
        type: string
        enum:
        - open
        - closed
        - all
        default: open
  responses:
    BadRequest:
      description: The request is invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication or webhook signature is invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource was not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The webhook body exceeds the configured limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: GitHub rate limit exhausted.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Resource:
          $ref: '#/components/headers/RateLimitResource'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: GitHub is unavailable or returned an invalid response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamTimeout:
      description: GitHub timed out.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    User:
      type: object
      additionalProperties: false
      required:
      - login
      - id
      - avatar_url
      properties:
        login:
          type: string
        id:
          type: integer
        avatar_url:
          type: string
          format: uri
    IssueCreate:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type:
          - string
          - 'null'
        labels:
          type: array
          items:
            type: string
          default: []
        assignees:
          type: array
          items:
            type: string
          default: []
    IssueUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
        body:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
          enum:
          - open
          - closed
          - null
    Issue:
      type: object
      additionalProperties: false
      required:
      - number
      - title
      - body
      - state
      - html_url
      - user
      - labels
      - assignees
      - created_at
      - updated_at
      properties:
        number:
          type: integer
          minimum: 1
        title:
          type: string
        body:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - open
          - closed
        html_url:
          type: string
          format: uri
        user:
          $ref: '#/components/schemas/User'
        labels:
          type: array
          items:
            type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - per_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    CommentCreate:
      type: object
      additionalProperties: false
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
    Comment:
      type: object
      additionalProperties: false
      required:
      - id
      - body
      - html_url
      - user
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        body:
          type: string
        html_url:
          type: string
          format: uri
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CommentList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - per_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    EventMetadata:
      type: object
      additionalProperties: false
      required:
      - id
      - event
      - action
      - issue_number
      - timestamp
      properties:
        id:
          type: string
        event:
          type: string
        action:
          type:
          - string
          - 'null'
        issue_number:
          type:
          - integer
          - 'null'
        timestamp:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
